name: CI — Build & Test

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

env:
  ACR_REGISTRY: matchjobacr.azurecr.io
  DOTNET_VERSION: "8.0.x"
  NODE_VERSION: "20"

jobs:

  # 1. Testes e Build do Backend .NET
  backend:
    name: Backend (.NET 8)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./backend

    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Cache NuGet
        uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: nuget-${{ hashFiles('**/*.csproj') }}
          restore-keys: nuget-

      - name: Restore dependências
        run: dotnet restore

      - name: Build
        run: dotnet build --no-restore -c Release

      - name: Testes unitários
        run: |
          dotnet test --no-build -c Release \
            --logger "trx;LogFileName=test-results.trx" \
            --collect:"XPlat Code Coverage" \
            -- DataCollectionRunSettings.DataCollectors.DataCollector.Configuration.Format=opencover

      - name: Publicar resultado dos testes
        uses: dorny/test-reporter@v1
        if: always()
        with:
          name: .NET Tests
          path: "**/*.trx"
          reporter: dotnet-trx

      - name: Upload cobertura
        uses: codecov/codecov-action@v4
        with:
          files: "**/coverage.opencover.xml"
          flags: backend

  # 2. Testes e Build do Frontend Next.js
  frontend:
    name: Frontend (Next.js)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./frontend

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Instalar dependências
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Testes unitários (Jest)
        run: npm test -- --coverage --watchAll=false --ci

      - name: Upload cobertura
        uses: codecov/codecov-action@v4
        with:
          flags: frontend

      - name: Build de produção
        run: npm run build
        env:
          NEXT_PUBLIC_API_URL: https://api.matchjob.com.br

  # 3. Build e Push das imagens Docker (apenas em push)
  docker-build:
    name: Docker Build & Push
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    if: github.event_name == 'push'

    steps:
      - uses: actions/checkout@v4

      - name: Login no Azure Container Registry
        uses: azure/docker-login@v2
        with:
          login-server: ${{ env.ACR_REGISTRY }}
          username: ${{ secrets.ACR_USERNAME }}
          password: ${{ secrets.ACR_PASSWORD }}

      - name: Definir tag da imagem
        id: tag
        run: echo "IMAGE_TAG=${GITHUB_SHA::8}" >> $GITHUB_OUTPUT

      - name: Build & Push — Backend
        uses: docker/build-push-action@v5
        with:
          context: .
          file: docker/backend/Dockerfile
          push: true
          tags: |
            ${{ env.ACR_REGISTRY }}/matchjob-backend:${{ steps.tag.outputs.IMAGE_TAG }}
            ${{ env.ACR_REGISTRY }}/matchjob-backend:latest

      - name: Build & Push — Frontend
        uses: docker/build-push-action@v5
        with:
          context: .
          file: docker/frontend/Dockerfile
          push: true
          build-args: |
            NEXT_PUBLIC_API_URL=https://api.matchjob.com.br
          tags: |
            ${{ env.ACR_REGISTRY }}/matchjob-frontend:${{ steps.tag.outputs.IMAGE_TAG }}
            ${{ env.ACR_REGISTRY }}/matchjob-frontend:latest
