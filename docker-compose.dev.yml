# docker-compose.dev.yml - Desenvolvimento com Hot-Reload
# Use com: docker-compose -f docker-compose.yml -f docker-compose.dev.yml up

version: '3.8'

services:
  backend:
    build:
      context: .
      dockerfile: ./docker/backend/Dockerfile
      target: build
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      DOTNET_USE_POLLING_FILE_WATCHER: 1
    volumes:
      - ./back:/src
      - /src/obj
      - /src/bin
    command: dotnet watch run --project MatchJob.csproj
    ports:
      - "8080:8080"
      - "5000:5000"

  frontend:
    build:
      context: .
      dockerfile: ./docker/frontend/Dockerfile
      target: deps
    environment:
      NODE_ENV: development
      NEXT_PUBLIC_API_URL: "http://localhost:8080"
      NEXT_PUBLIC_SUPABASE_URL: "https://placeholder.supabase.co"
      NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: "placeholder-key"
    volumes:
      - ./front:/app
      - /app/node_modules
      - /app/.next
    command: npm run dev
    ports:
      - "3000:3000"

  mobile:
    build:
      context: .
      dockerfile: ./docker/mobile/Dockerfile
      target: dev
    environment:
      NODE_ENV: development
      EXPO_PUBLIC_API_URL: "http://localhost:8080"
      EXPO_PUBLIC_SUPABASE_URL: "https://placeholder.supabase.co"
      EXPO_PUBLIC_SUPABASE_ANON_KEY: "placeholder-key"
      EXPO_DEVTOOLS_LISTEN_ADDRESS: "0.0.0.0"
      CHOKIDAR_USEPOLLING: "true"
      WATCHPACK_POLLING: "true"
    volumes:
      - ./mobile:/app
      - /app/node_modules
    command: npx expo start --lan
    ports:
      - "8081:8081"
      - "19000:19000"
      - "19001:19001"
      - "19002:19002"
