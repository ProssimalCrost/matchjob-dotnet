networks:
  matchjob-net:
    driver: bridge

volumes:
  sqlserver-data:
  redis-data:

services:

  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: matchjob-db
    environment:
      SA_PASSWORD: "MatchJob@2024!"
      ACCEPT_EULA: "Y"
      MSSQL_PID: Developer
    ports:
      - "1433:1433"
    volumes:
      - sqlserver-data:/var/opt/mssql
    networks:
      - matchjob-net
    healthcheck:
      test: ["CMD-SHELL", "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P 'MatchJob@2024!' -Q 'SELECT 1' -No || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  redis:
    image: redis:7-alpine
    container_name: matchjob-redis
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    networks:
      - matchjob-net
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      retries: 5

  backend:
    build:
      context: .
      dockerfile: ./docker/backend/Dockerfile
      target: runtime
    container_name: matchjob-api
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ConnectionStrings__DefaultConnection: "Server=sqlserver;Database=MatchJobDb;User Id=sa;Password=MatchJob@2024!;TrustServerCertificate=True"
      Redis__Connection: "redis:6379"
      Supabase__Url: "https://your-project.supabase.co"
    ports:
      - "8080:8080"
    depends_on:
      sqlserver:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - matchjob-net
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  frontend:
    build:
      context: .
      dockerfile: ./docker/frontend/Dockerfile
      target: runner
      args:
        NEXT_PUBLIC_API_URL: "http://localhost:8080"
    container_name: matchjob-web
    environment:
      NEXT_PUBLIC_API_URL: "http://localhost:8080"
      NODE_ENV: production
    ports:
      - "3000:3000"
    depends_on:
      - backend
    networks:
      - matchjob-net
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:3000"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
